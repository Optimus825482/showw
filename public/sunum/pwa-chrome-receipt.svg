<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-label="Mobil PWA Chrome Kurulumu ve Akıllı 80mm Termal Fiş Yapısı">
  <defs>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
    <filter id="softShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
    <linearGradient id="skyBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="meshBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#fffbeb" />
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#cbd5e1" opacity="0.55" />
    </pattern>
    
  </defs>
  
    <rect width="1100" height="540" rx="26" fill="url(#meshBg)" stroke="#e2e8f0" />

    <!-- LEFT: PWA & CHROME PANEL -->
    <g filter="url(#cardShadow)">
      <rect x="34" y="34" width="504" height="472" rx="22" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
      <text x="62" y="72" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="800" fill="#0f172a">PWA &amp; Google Chrome Deneyimi</text>
      <text x="62" y="94" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">Kurulu değilse otomatik kurulum bildirimi ve Chrome yönlendirmesi</text>

      <!-- Notification Mockup -->
      <rect x="62" y="116" width="448" height="104" rx="16" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5" />
      
    <g transform="translate(80, 134)">
      <rect x="0" y="0" width="28" height="28" rx="8" fill="url(#skyBrand)" />
      <path d="M7 18 C7 12.5 21 12.5 21 18 Z" fill="#ffffff" />
      <circle cx="14" cy="9.5" r="2.2" fill="#fbbf24" />
      <rect x="6" y="19.5" width="16" height="2.4" rx="1.2" fill="#e0f2fe" />
    </g>
  
      <text x="118" y="147" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Uygulama cihazınızda kurulu değil</text>
      <text x="118" y="165" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#475569">Kiosk tam ekran için Chrome ile ana ekrana ekleyin</text>
      <rect x="80" y="182" width="164" height="26" rx="8" fill="#0284c7" />
      <text x="162" y="199" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">⬇ Uygulamayı Kur (PWA)</text>
      <rect x="254" y="182" width="136" height="26" rx="8" fill="#f59e0b" />
      <text x="322" y="199" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">🌐 Chrome&apos;da Aç</text>

      <!-- Features Grid inside PWA card -->
      <rect x="62" y="240" width="216" height="114" rx="14" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="80" y="266" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#0f172a">Android &amp; iOS Deep-Link</text>
      <text x="80" y="288" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#475569">• Android intent:// com.android.chrome</text>
      <text x="80" y="308" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#475569">• iOS googlechromes:// yönlendirme</text>
      <text x="80" y="328" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#475569">• WhatsApp / WebView uyarısı</text>

      <rect x="294" y="240" width="216" height="114" rx="14" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="312" y="266" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#0f172a">Çevrimdışı &amp; İkon Seti</text>
      <text x="312" y="288" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#475569">• /manifest.webmanifest + /sw.js</text>
      <text x="312" y="308" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#475569">• 192px &amp; 512px Maskable PNG</text>
      <text x="312" y="328" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#475569">• /offline.html kesinti koruması</text>

      <!-- App Icon Showcase -->
      <rect x="62" y="372" width="448" height="106" rx="16" fill="#0f172a" />
      <rect x="84" y="392" width="66" height="66" rx="18" fill="url(#skyBrand)" />
      <path d="M98 434 C98 416 136 416 136 434 Z" fill="#ffffff" />
      <circle cx="117" cy="409" r="5" fill="#fbbf24" />
      <rect x="95" y="438" width="44" height="6" rx="3" fill="#e0f2fe" />
      <text x="172" y="416" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Show Büfe — Standalone Kiosk Modu</text>
      <text x="172" y="438" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">Adres çubuğu olmadan tablet ve mobilde tam ekran uygulama</text>
    </g>

    <!-- RIGHT: 80MM THERMAL RECEIPT & PRINTER RULE -->
    <g filter="url(#cardShadow)">
      <rect x="562" y="34" width="504" height="472" rx="22" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" />
      <text x="590" y="72" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="800" fill="#0f172a">Akıllı Yazıcı &amp; 80mm Termal Fiş</text>
      <text x="590" y="94" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">Kayıtlı yazıcı yoksa gizlenir, varsa otomatik fiş çıkarır</text>

      <!-- Receipt Paper -->
      <rect x="592" y="116" width="244" height="364" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3" />
      <text x="714" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#0f172a">ROYAL ANA RESTAURANT</text>
      <text x="714" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#0284c7">SHOW BÜFE ADİSYON</text>
      <line x1="612" y1="180" x2="816" y2="180" stroke="#cbd5e1" stroke-dasharray="4 2" />
      <text x="714" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">SIRA #14</text>
      <text x="614" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">ODA   : 412</text>
      <text x="614" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">MİSAFİR: Ahmet Yılmaz</text>
      <text x="614" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">SAAT  : 15.11.2026 09:14</text>
      <line x1="612" y1="282" x2="816" y2="282" stroke="#cbd5e1" stroke-dasharray="4 2" />
      <text x="614" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#0f172a">2x KAŞARLI OMLET</text>
      <text x="626" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#475569">[ORTA] Not: Az tuzlu</text>
      <text x="614" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#0f172a">1x MENEMEN</text>
      <text x="626" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#475569">[SUCUKLU, ACILI]</text>
      <line x1="612" y1="392" x2="816" y2="392" stroke="#cbd5e1" stroke-dasharray="4 2" />
      <text x="714" y="422" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#334155">Afiyet Olsun!</text>
      <text x="714" y="446" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748b">* 80mm / A5 Yazdırma Uyumlu *</text>

      <!-- Printer Policy Cards -->
      <rect x="854" y="116" width="190" height="170" rx="16" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="870" y="144" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#065f46">✓ Yazıcı Tanımlıysa</text>
      <text x="870" y="170" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#047857">• Otomatik yazdır açık</text>
      <text x="870" y="192" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#047857">• Kayıtta fiş tetiklenir</text>
      <text x="870" y="214" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#047857">• 5 dk önbellekli tarama</text>
      <text x="870" y="236" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#047857">• Bekleyenlerde tekrar basım</text>

      <rect x="854" y="306" width="190" height="174" rx="16" fill="#fffbeb" stroke="#fde68a" />
      <text x="870" y="334" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#92400e">∅ Yazıcı Yoksa</text>
      <text x="870" y="360" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#b45309">• Yazdır butonları gizlenir</text>
      <text x="870" y="382" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#b45309">• Gereksiz print penceresi</text>
      <text x="870" y="400" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#b45309">  açılmaz</text>
      <text x="870" y="424" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#b45309">• Tek tıkla doğrudan kayıt</text>
    </g>
    
</svg>
