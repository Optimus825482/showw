<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Çevrimdışı | Show Büfe</title>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-color: #f8fafc;
      color: #0f172a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 26rem;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.5rem;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    .logo {
      width: 4rem;
      height: 4rem;
      border-radius: 1rem;
      margin-bottom: 1rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
      font-weight: 800;
    }
    p {
      margin: 0 0 1.25rem;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #475569;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.65rem 1.25rem;
      border: none;
      border-radius: 0.75rem;
      background: #0284c7;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/logo.svg" alt="Show Büfe Logo" width="64" height="64" class="logo" />
    <h1>Bağlantı Kurulamadı</h1>
    <p>
      Şu an ağ bağlantınız kesik görünüyor. Show Büfe mutfak ve adisyon verilerini
      senkronize edebilmek için internet veya yerel ağ bağlantınızı kontrol edin.
    </p>
    <button type="button" onclick="window.location.reload()">Yeniden Dene</button>
  </main>
</body>
</html>
